# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/browser/webserver.pid;
error_log /var/log/sdkwork/browser/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name browser-staging.sdkwork.com browser-staging.birdcoder.com browser-staging.dtupay.com browser-staging.sdkwork.cn browser-staging.birdcoder.cn browser-staging.dtupay.cn browser-staging.skubc.com browser-staging.skubc.cn browser-staging.zowalk.com browser-staging.zowalk.cn browser-staging.offer86.com browser-staging.offer86.cn browser-staging.86offer.com browser-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
