[package]
rust-version.workspace = true
name = "sdkwork-browser-pc-desktop"
version = "0.1.0"
description = "SDKWork Browser PC Tauri desktop host shell."
authors = ["SDKWork"]
license = "Apache-2.0"
edition = "2021"


[lints]
workspace = true
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri = { version = "2", features = ["unstable"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sdkwork_browser_tauri_host.workspace = true
sdkwork-browser-platform-service = { workspace = true }

[lib]
name = "sdkwork_browser_pc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sdkwork-browser-pc-desktop"
path = "src/main.rs"
